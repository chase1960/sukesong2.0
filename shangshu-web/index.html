<!-- 启动反馈必须不依赖外部 CSS/JS，避免样式网络失败时露出裸页面。 -->
<style>
  #boot-veil{position:fixed;inset:0;z-index:9999;background:#E8EAEB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;font:14px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif;color:#1e232c;text-align:center}
  #boot-veil .boot-seal{display:block;width:52px;height:52px;object-fit:contain}
  #boot-veil .boot-txt{margin:0;font:inherit;color:inherit}
  #boot-veil .boot-bar{width:96px;height:2px;border-radius:2px;background:rgba(0,0,0,.08);overflow:hidden}
  #boot-veil .boot-bar i{display:block;width:38%;height:100%;border-radius:2px;background:#10B981;animation:boot-slide 1.1s ease-in-out infinite}
  #boot-retry{height:36px;padding:0 16px;border:1px solid rgba(0,0,0,.14);border-radius:5px;background:#fff;color:#1e232c;font:inherit;cursor:pointer}
  #boot-retry[hidden]{display:none}
  @keyframes boot-slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  @media(prefers-reduced-motion:reduce){#boot-veil .boot-bar i{animation:none;width:100%}}
</style>
<script id="boot-readiness">
(function () {
  var ready = document.readyState !== 'loading';
  var expired = false;
  var gone = false;
  var failed = new Set();
  // 必须在 stylesheet 标签前注册；后置内联脚本自身也会被慢 CSS 阻塞。
  function parsed(link) {
    try { return !!(link.sheet && link.sheet.cssRules.length); }
    catch (_) { return false; }
  }
  function feedback(message) {
    var veil = document.getElementById('boot-veil');
    var label = document.getElementById('boot-message');
    var retry = document.getElementById('boot-retry');
    if (!veil || !label || !retry) return;
    label.textContent = message;
    retry.hidden = false;
    veil.setAttribute('aria-busy', 'false');
  }
  function check() {
    if (gone) return;
    var styles = Array.prototype.slice.call(document.querySelectorAll('link[rel="stylesheet"]'));
    var pending = !styles.length || styles.some(function (link) { return !parsed(link); });
    var hasFailure = styles.some(function (link) { return failed.has(link); });
    var veil = document.getElementById('boot-veil');
    if (ready && !pending && !hasFailure && veil) {
      gone = true;
      clearTimeout(timeout);
      document.removeEventListener('load', resource, true);
      document.removeEventListener('error', resource, true);
      document.removeEventListener('click', retry);
      document.removeEventListener('DOMContentLoaded', domReady);
      veil.remove();
      return;
    }
    if (hasFailure) feedback('页面样式加载失败，请检查网络后重试。');
    else if (expired) feedback(pending ? '页面样式未能加载完成，请检查网络后重试。' : '页面资源加载较慢，请检查网络后重试。');
  }
  function resource(event) {
    var link = event.target;
    if (!link || !link.matches || !link.matches('link[rel="stylesheet"]')) return;
    if (event.type === 'error') failed.add(link);
    else failed.delete(link);
    check();
  }
  function domReady() { ready = true; check(); }
  function retry(event) {
    if (event.target && event.target.id === 'boot-retry') window.location.reload();
  }
  document.addEventListener('load', resource, true);
  document.addEventListener('error', resource, true);
  document.addEventListener('click', retry);
  document.addEventListener('DOMContentLoaded', domReady);
  var timeout = setTimeout(function () { expired = true; check(); }, 10000);
  check();
})();
</script>
