<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>尚书 · v3.2 对话三形态 + 业务双向联动</title>
<!--
  v3.2（2026-08-17）—— 对 v3.1「顶部常驻对话框」的否决的回应。自包含，可直接 file:// 打开。

  否决理由（用户）：顶部放对话框太疑惑（分不清搜索/命令/聊天），且对话时看不到对应界面的变化。
  v3.2 的做法：对话不是三个功能，是**同一会话的三种显示形态**，外加业务页面的双向联动。

    ① 悬浮（右下角，360×480，可拖动/最小化）—— 随手问，不遮挡导航与表格
    ② 分栏（业务 65% / 对话 35%，分割线可拖）—— 边对话边作业，主力形态
    ③ 全屏（对话主页）—— 长任务、连续分析、翻会话历史

  三形态共用同一份状态：msgs / 上下文 / 执行进度。切形态不重开会话，最小化不中断任务。

  双向联动（本原型要验证的核心，不只是三个尺寸的聊天框）：
    点业务行  → 对话上下文跟着变（顶部 ctx 条）
    AI 出结果 → 业务界面自动切域/筛选/高亮/开抽屉
    写操作    → 确认卡出现在**业务页面**里，不在对话窗内偷偷完成

  入口分工（顶部不再有对话框）：
    ⌘K 命令面板 = 找模块/跳页面    ⌘J = 唤起对话（回到上次形态）
-->
<style>
:root{
  /* 中性灰不再带绿味（用户反馈「整体偏绿」）：绿只留给选中/主操作/语义 chip */
  --plane:#ffffff; --canvas:#E8EAEB; --rail:#EFF0F1; --bar:#F5F6F7; --sunk:rgba(0,0,0,.045);
  --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.12);
  /* 卡片：上圆角、下方直落到底，靠发丝环 + 边缘阴影分区 */
  --r-card:10px;
  --card:0 0 0 1px rgba(0,0,0,.06),0 4px 18px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --fg:#1a1f27; --fg2:rgba(0,0,0,.62); --fg3:rgba(0,0,0,.42); --fg4:rgba(0,0,0,.28);
  --green:#10B981; --green2:#0EA372; --green-ink:#0A6E4C; --acc:#34D399; --accd:#E9F8F1;
  --halo:0 0 0 1px rgba(0,0,0,.08),0 0 0 3px rgba(16,185,129,.05),0 2px 10px rgba(16,185,129,.10);
  --halo-on:0 0 0 1px rgba(16,185,129,.32),0 0 0 4px rgba(16,185,129,.08),0 3px 16px rgba(16,185,129,.16);
  --amber:#B4740A; --amberd:#FDF6E7; --red:#C93B3B; --redd:#FBEDED;
  --pad:24px; --gap-sec:22px; --row:38px;
  --r:6px; --r-sm:5px; --r-xs:4px;
  --pop:0 12px 34px rgba(0,0,0,.13),0 0 0 1px rgba(0,0,0,.07);
  --ease:cubic-bezier(.22,.9,.28,1);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);font-size:13.5px;line-height:1.6;color:var(--fg);
  background:var(--canvas);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:left}
input{font:inherit;border:none;outline:none;background:transparent;color:inherit}
svg{width:15px;height:15px;display:block;flex-shrink:0}   /* 兜底尺寸，防内联 svg 撑满容器 */
::selection{background:rgba(0,0,0,.08)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:transparent;border-radius:4px}
:hover::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16)}

/* ═══ 顶栏：只剩品牌 + 命令面板 + 用户（对话框已撤）═══ */
.top{height:42px;flex-shrink:0;display:flex;align-items:center;gap:12px;
  padding:0 14px;background:var(--canvas)}
.top img{height:19px;width:auto;object-fit:contain;object-position:left center}
.top-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.kbd{font-size:10.5px;color:var(--fg4);padding:2px 6px;border-radius:3px;background:var(--sunk)}
.icb{width:27px;height:27px;border-radius:var(--r-xs);display:grid;place-items:center;color:var(--fg3)}
.icb:hover{background:rgba(0,0,0,.06);color:var(--fg)}
.icb[disabled]{opacity:.3;pointer-events:none}
.ava{width:25px;height:25px;border-radius:var(--r-sm);background:rgba(0,0,0,.07);
  display:grid;place-items:center;font-size:11px}

/* ═══ 骨架 ═══ */
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.body{flex:1;min-height:0;display:flex;overflow:hidden;background:var(--canvas)}
/* rail 不做卡片，坐在画布上；卡片只给两个主面板，形成「面板浮在画布上」的层次 */
.rail{width:68px;flex-shrink:0;display:flex;flex-direction:column;background:transparent}
.rail-nav{flex:1;min-height:0;overflow-y:auto;padding:8px 6px 0;display:flex;flex-direction:column;gap:2px}
.dom{position:relative;width:100%;padding:8px 0 6px;border-radius:var(--r-sm);
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg2)}
.dom:hover{background:rgba(0,0,0,.04);color:var(--fg)}
.dom.on{background:#fff;color:var(--green2);box-shadow:0 0 0 1px rgba(0,0,0,.05),0 1px 3px rgba(0,0,0,.05)}
.dom svg{width:18px;height:18px}
.dom b{font-size:10.5px;font-weight:500}
.dom .bdg{position:absolute;top:5px;right:10px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;
  background:var(--red);color:#fff;font-size:9.5px;line-height:15px;text-align:center;font-weight:600}
.rail-sep{height:12px;margin:3px 10px}
.rail-lab{font-size:9.5px;letter-spacing:1px;color:var(--fg4);text-align:center;padding:2px 0 4px}

/* 工作区 = 业务列 (+ 分栏时的对话列)；两列各自是一张卡片 */
.zone{flex:1;min-width:0;display:flex;overflow:hidden;padding:6px 8px 0 2px}
.card{background:var(--plane);border-radius:var(--r-card) var(--r-card) 0 0;
  box-shadow:var(--card);overflow:hidden}
.biz{flex:1;min-width:0;display:flex}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--plane)}
.main-hd{flex-shrink:0;padding:13px var(--pad) 0}
.main-t{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.main-t h1{font-size:16.5px;font-weight:600}
.main-t .sub{font-size:11.5px;color:var(--fg3)}
.main-t .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.segs{display:flex;gap:4px;padding-bottom:9px}
.segs button{padding:3px 10px;border-radius:var(--r-xs);font-size:12px;color:var(--fg2)}
.segs button:hover{background:rgba(0,0,0,.05)}
.segs button.on{background:var(--sunk);color:var(--fg);font-weight:500}
.segs button .n{color:var(--fg4);margin-left:4px;font-variant-numeric:tabular-nums}
.bulk{display:flex;align-items:center;gap:10px;margin-bottom:9px;padding:7px 12px;
  border-radius:var(--r-sm);background:var(--accd);font-size:12.5px;color:var(--green-ink)}
.bulk .sp{margin-left:auto;display:flex;gap:8px}
.main-body{flex:1;min-height:0;overflow-y:auto;padding:0 var(--pad) var(--pad)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:0 10px;height:var(--row);font-size:13px;
  border-bottom:1px solid rgba(0,0,0,.05)}
th{font-size:11px;letter-spacing:.6px;color:var(--fg3);font-weight:500;height:30px;
  position:sticky;top:0;background:var(--plane);z-index:2;border-bottom:1px solid var(--line)}
th.num,td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
th.ck,td.ck{width:34px;padding-right:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(0,0,0,.022)}
/* 选中用中性灰底 + 绿色左标，绿色面积压到最小 */
tbody tr.on{background:rgba(0,0,0,.04)}
tbody tr.on td:first-child{box-shadow:inset 2px 0 0 var(--green)}
tbody tr.draft{background:rgba(180,116,10,.055)}
tbody tr.draft td:last-child:after{content:"待应用";margin-left:7px;padding:1px 5px;border-radius:3px;
  background:var(--amberd);color:var(--amber);font-size:9.5px}
/* AI 定位到的行：闪一下（联动的视觉回执） */
@keyframes flash{0%,100%{background:transparent}18%,62%{background:rgba(52,211,153,.28)}}
tbody tr.flash{animation:flash 1.5s var(--ease) 2}
th,td{white-space:nowrap}
td .who{font-weight:500;display:inline-block;max-width:200px;overflow:hidden;
  text-overflow:ellipsis;vertical-align:bottom}
td .meta{color:var(--fg3);font-size:11.5px}
.ckbx{width:14px;height:14px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line2);
  display:grid;place-items:center;color:transparent;background:#fff}
.ckbx.on{background:var(--green);box-shadow:none;color:#fff}
.ckbx svg{width:10px;height:10px}
.chip{display:inline-block;padding:0 6px;border-radius:var(--r-xs);font-size:10.5px;line-height:17px;white-space:nowrap}
.chip.wait{background:var(--amberd);color:var(--amber)}
.chip.over{background:var(--redd);color:var(--red)}
.chip.ok{background:var(--accd);color:var(--green-ink)}
.chip.idle{background:var(--sunk);color:var(--fg3)}
.btn{height:29px;padding:0 12px;border-radius:var(--r-sm);font-size:12.5px;
  display:inline-flex;align-items:center;gap:6px}
.btn svg{width:14px;height:14px}
.btn-pri{background:var(--green);color:#fff}
.btn-pri:hover{background:var(--green2)}
.btn-gh{color:var(--fg2);background:var(--sunk)}
.btn-gh:hover{background:var(--sunk);color:var(--fg)}
.btn-sm{height:25px;padding:0 9px;font-size:12px}
.vsw{display:flex;gap:2px;background:var(--sunk);padding:2px;border-radius:var(--r-sm)}
.vsw button{padding:3px 10px;border-radius:var(--r-xs);font-size:12px;color:var(--fg2)}
.vsw button.on{background:#fff;color:var(--fg)}
.sel{height:29px;padding:0 9px;border-radius:var(--r-sm);font-size:12.5px;
  background:var(--sunk);display:inline-flex;align-items:center;gap:7px}
.empty{padding:42px 0;text-align:center;color:var(--fg3);font-size:13px}

/* 确认卡：AI 提出写操作时，落在业务页面里（不在对话窗内完成）*/
.confirm{margin:0 0 12px;padding:11px 13px;border-radius:var(--r-sm);
  background:var(--accd)}
.confirm .h{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--green-ink);font-weight:600}
.confirm .d{font-size:12.5px;color:var(--fg2);margin:6px 0 9px}
.confirm .d b{color:var(--fg);font-family:var(--mono)}
.confirm .a{display:flex;gap:8px}

/* ═══ 详情抽屉 ═══ */
.drawer{width:0;flex-shrink:0;overflow:hidden;background:#FCFCFD;
  box-shadow:inset 1px 0 0 var(--line);
  transition:width .2s var(--ease);display:flex;flex-direction:column}
.drawer.open{width:400px}
.drawer.open.narrow{width:330px}   /* 分栏时收窄，给表格留列宽 */
.dw-hd{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:13px 16px 10px;
  border-bottom:1px solid var(--line)}
.dw-hd h2{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dw-body{flex:1;min-height:0;overflow-y:auto;padding:15px 16px}
.dw-foot{flex-shrink:0;display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.blk{margin-bottom:var(--gap-sec)}
.sec-t{font-size:10.5px;letter-spacing:1.3px;color:var(--fg3);margin-bottom:8px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.f-k{font-size:10.5px;color:var(--fg3)}
.f-v{font-size:13px}
.f-v.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.f-v.big{font-size:19px;font-weight:600;font-family:var(--mono)}
.ev{display:flex;gap:9px;padding:6px 0;font-size:12px}
.ev .t{font-family:var(--mono);font-size:11px;color:var(--fg3);flex-shrink:0;width:80px}
.tk{background:#fff;border-radius:var(--r-sm);padding:8px 10px;margin-bottom:6px;
  box-shadow:0 0 0 1px rgba(0,0,0,.05);font-size:12.5px}
.tk .m{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11px;color:var(--fg3)}
.bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.note{margin-top:var(--gap-sec);padding:10px 12px;border-radius:var(--r-sm);
  background:var(--amberd);color:var(--amber);font-size:12px;line-height:1.7}
.note code{font-family:var(--mono);font-size:11.5px;background:rgba(0,0,0,.05);padding:0 3px;border-radius:3px}
.mock{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:var(--r-xs);
  background:var(--amberd);color:var(--amber);font-size:10.5px}
.mock svg{width:11px;height:11px}

/* AI 草稿层：类似 Git diff，但修改确认前不碰正式数据 */
.draft-summary{margin:0 0 12px;padding:10px 12px;border-radius:var(--r-sm);
  background:linear-gradient(90deg,rgba(180,116,10,.09),rgba(180,116,10,.035));
  display:flex;align-items:center;gap:9px;color:var(--amber);font-size:12px}
.draft-summary .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex-shrink:0}
.draft-summary .acts{margin-left:auto;display:flex;gap:7px}
.diff-field{padding:7px 8px;border-radius:var(--r-sm);background:rgba(255,255,255,.75)}
.diff-line{display:flex;align-items:center;gap:6px;margin-top:3px;font-family:var(--mono);font-size:12px}
.diff-line i{font-style:normal;width:10px;font-weight:700}
.diff-old{color:var(--red);text-decoration:line-through;background:rgba(201,59,59,.055)}
.diff-new{color:var(--green-ink);background:rgba(16,185,129,.075)}

/* ═══════════ 对话：三形态共用同一内层（cw-*）═══════════ */
/* 形态 1：悬浮（右下角，可拖动/最小化） */
.fab{position:fixed;right:20px;bottom:20px;z-index:70;height:38px;padding:0 14px;border-radius:19px;
  background:var(--green);color:#fff;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;
  box-shadow:0 6px 20px rgba(16,185,129,.34)}
.fab:hover{background:var(--green2)}
.fab .n{min-width:16px;height:16px;border-radius:8px;background:#fff;color:var(--green2);
  font-size:10px;line-height:16px;text-align:center;font-weight:700}
.float{position:fixed;z-index:71;width:360px;height:480px;background:var(--plane);
  border-radius:var(--r-card);box-shadow:var(--pop);display:flex;flex-direction:column;overflow:hidden}
/* 形态 2：分栏（业务 65% / 对话 35%，分割线可拖）*/
/* 分栏的「缝」= 画布本身；卡片边缘阴影就是分区线，不再画竖线 */
.splitter{width:10px;flex-shrink:0;cursor:col-resize;background:transparent;position:relative}
.splitter:after{content:"";position:absolute;left:4px;top:calc(50% - 22px);width:2px;height:44px;
  border-radius:2px;background:transparent;transition:background .15s var(--ease)}
.splitter:hover:after{background:rgba(0,0,0,.22)}
/* 三形态一律白底（悬浮白/放大变绿底的不一致已修） */
.chat-col{flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}
/* 形态 3：全屏（对话主页：会话历史 + 对话流）*/
.full{flex:1;min-width:0;display:flex}
.hist{width:210px;flex-shrink:0;display:flex;flex-direction:column;background:var(--bar);
  box-shadow:inset -1px 0 0 var(--line)}
.hist-hd{padding:10px 10px 8px;flex-shrink:0}
.btn-new{width:100%;height:31px;border-radius:var(--r-sm);background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:500}
.btn-new:hover{background:var(--green2)}
.hist-bd{flex:1;min-height:0;overflow-y:auto;padding:0 6px 10px}
.hist-sec{padding:9px 6px 4px;font-size:9.5px;letter-spacing:1.2px;color:var(--fg4)}
.hist-it{display:block;width:100%;padding:6px 8px;border-radius:var(--r-xs);font-size:12.5px;color:var(--fg2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-it:hover{background:rgba(0,0,0,.04)}
.hist-it.on{background:#fff;color:var(--fg)}

/* 对话内层（三形态共用）*/
.cw{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.cw-hd{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:10px 11px;
  background:var(--plane);border-bottom:1px solid var(--line)}
.cw-hd .t{font-size:12.5px;font-weight:600;flex:1;display:flex;align-items:center;gap:6px}
.cw-hd .t svg{color:var(--acc)}
.mode-sw{display:flex;gap:1px}
.mode-sw button{width:24px;height:24px;border-radius:var(--r-xs);display:grid;place-items:center;color:var(--fg3)}
.mode-sw button:hover{background:rgba(0,0,0,.07);color:var(--fg)}
.mode-sw button.on{background:#fff;color:var(--green2)}
/* 上下文条：对话永远显示它正对着哪个业务对象（联动的另一半）*/
.ctx{flex-shrink:0;display:flex;align-items:center;gap:6px;margin:8px 11px 0;padding:5px 8px;
  border-radius:var(--r-xs);background:var(--accd);font-size:11.5px;color:var(--green-ink)}
.ctx svg{width:12px;height:12px}
.ctx b{font-weight:600}
.ctx .x{margin-left:auto;color:var(--green-ink);opacity:.6}
.cw-body{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 4px}
.cw.wide .cw-body{padding:20px 26px 6px;max-width:780px;margin:0 auto;width:100%}
.msg{display:flex;gap:9px;margin-bottom:15px}
.msg.user{justify-content:flex-end}
.msg .av{width:12px;height:12px;margin-top:6px;color:var(--acc)}
.msg .av svg{width:12px;height:12px}
.msg .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.78}
.msg .tx>:first-child{margin-top:0}
.msg .tx p{margin:7px 0}
.bub{max-width:80%;padding:8px 12px;border-radius:var(--r);background:var(--sunk);font-size:13px;line-height:1.68}
.tool{margin:7px 0;padding:6px 10px;border-radius:var(--r-sm);background:var(--sunk);
  font-size:11.5px;color:var(--fg2);display:flex;align-items:center;gap:7px}
.tool .k{font-family:var(--mono);font-size:11px;color:var(--green-ink)}
/* AI 回复里的跳转动作：点一下业务界面就切过去并高亮 */
.jump{display:inline-flex;align-items:center;gap:5px;margin:3px 6px 3px 0;padding:3px 9px;
  border-radius:var(--r-xs);font-size:12px;color:var(--green-ink);background:var(--accd)}
.jump:hover{background:#D8F3E7}
.jump svg{width:12px;height:12px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.cw.wide .sugg{max-width:780px;margin:0 auto;width:100%;padding:0 26px 12px}
.sugg button{padding:4px 10px;border-radius:var(--r-xs);font-size:12px;color:var(--fg2);background:var(--sunk)}
.sugg button:hover{background:var(--sunk);color:var(--fg)}
.cw-input{flex-shrink:0;padding:6px 14px 12px}
.cw.wide .cw-input{max-width:780px;margin:0 auto;width:100%;padding:6px 26px 18px}
.ibox{background:#fff;border-radius:var(--r);box-shadow:var(--halo);padding:8px 10px}
.ibox:focus-within{box-shadow:var(--halo-on)}
.ibox textarea{width:100%;border:none;outline:none;resize:none;font:inherit;font-size:13.5px;
  line-height:1.7;color:var(--fg);background:transparent;min-height:23px;max-height:110px}
.ibox-f{display:flex;align-items:center;gap:8px;margin-top:4px}
.ibox-f .h{font-size:10.5px;color:var(--fg4);margin-right:auto}
.send{width:25px;height:25px;border-radius:var(--r-sm);background:var(--green);color:#fff;display:grid;place-items:center}
.send:hover{background:var(--green2)}
/* 后台执行：最小化后任务不中断 */
.run{display:flex;align-items:center;gap:7px;margin:7px 0;padding:6px 10px;border-radius:var(--r-sm);
  background:var(--amberd);font-size:11.5px;color:var(--amber)}
@keyframes spin{to{transform:rotate(360deg)}}
.run .sp{width:11px;height:11px;border-radius:50%;border:1.6px solid rgba(180,116,10,.3);
  border-top-color:var(--amber);animation:spin .8s linear infinite}

/* ═══ 命令面板 ═══ */
.mask{position:fixed;inset:0;background:rgba(20,24,20,.28);z-index:100;display:none}
.mask.show{display:block}
#cmd{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:101;
  width:min(600px,calc(100vw - 48px));max-height:min(500px,calc(100vh - 150px));
  background:#fff;border-radius:var(--r);box-shadow:var(--pop);display:none;flex-direction:column}
#cmd.show{display:flex}
.cmd-hd{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
.cmd-hd svg{color:var(--fg3)}
.cmd-hd input{flex:1;font-size:14.5px}
.cmd-bd{flex:1;min-height:0;overflow-y:auto;padding:6px}
.cmd-sec{padding:8px 9px 4px;font-size:9.5px;letter-spacing:1.2px;color:var(--fg4)}
.cmd-it{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:var(--r-xs);font-size:13px}
.cmd-it:hover,.cmd-it.cur{background:var(--sunk)}
.cmd-it .ico{color:var(--fg3)}
.cmd-it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-it .tag{font-size:10.5px;color:var(--fg4)}
.pin{width:22px;height:22px;border-radius:3px;display:grid;place-items:center;color:var(--fg4);opacity:0}
.cmd-it:hover .pin,.pin.on{opacity:1}
.pin.on{color:var(--amber)}
.cmd-ft{flex-shrink:0;padding:8px 14px;border-top:1px solid var(--line);
  font-size:11px;color:var(--fg4);display:flex;gap:14px}
</style>

      </div>
      ${chatHtml('wide')}
    </div>`;
    return;
  }
  const split=chatMode==='split';
  z.innerHTML=`<div class="biz card">${mainHtml()}${drawerHtml()}</div>
    ${split?`<div class="splitter" id="splitter"></div>
      <div class="chat-col card" style="width:${splitW}%">${chatHtml()}</div>`:''}`;
  if(split) bindSplitter();
}

function bindSplitter(){
  const sp=$('#splitter');if(!sp)return;
  sp.addEventListener('mousedown',e=>{
    e.preventDefault();
    const zw=$('#zone').getBoundingClientRect();
    const mv=(ev)=>{
      const pct=(zw.right-ev.clientX)/zw.width*100;
      splitW=Math.min(60,Math.max(24,pct));
      const c=document.querySelector('.chat-col');if(c)c.style.width=splitW+'%';
    };
    const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};
    addEventListener('mousemove',mv);addEventListener('mouseup',up);
  });
}
/* 悬浮窗：拖动 + 位置记忆 */
let flPos={right:20,bottom:74};
function renderFloat(){
  const el=$('#float');
  if(chatMode!=='float'){el.style.display='none';return}
  el.style.display='flex';
  el.style.right=flPos.right+'px';el.style.bottom=flPos.bottom+'px';
  el.innerHTML=chatHtml();
  const hd=el.querySelector('.cw-hd');
  hd.style.cursor='move';
  hd.addEventListener('mousedown',e=>{
    if(e.target.closest('button'))return;
    const sx=e.clientX,sy=e.clientY,r0=flPos.right,b0=flPos.bottom;
    const mv=(ev)=>{
      flPos.right=Math.max(8,r0-(ev.clientX-sx));
      flPos.bottom=Math.max(8,b0-(ev.clientY-sy));
      el.style.right=flPos.right+'px';el.style.bottom=flPos.bottom+'px';
    };
    const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};
    addEventListener('mousemove',mv);addEventListener('mouseup',up);
  });
}

function ask(kind){
  if(kind==='diff'){
    msgs.push({r:'u',t:'重新识别国网这张票，并把修改实时显示在左边'});
    msgs.push({r:'a',t:'正在重新读取票面。修改会先进入草稿层，左侧会逐字段显示 before / after；在你点击“应用”前不会写入正式数据。'});
    dom='fin';seg.fin='inv';sel.fin='d3';ctx={label:'国网浙江省电力公司',id:'d3'};flashId='d3';
    draftPatch={id:'d3',status:'streaming',changes:[]};running=true;
    render();

      {field:'amount_ex_tax',before:'¥5,351.77',after:'¥5,547.25',value:'5,547.25'},
      {field:'tax_amount',before:'¥694.73',after:'¥499.25',value:'499.25'},
      {field:'confidence',before:'61%',after:'96%',value:'96%'}
    ];
    changes.forEach((change,i)=>setTimeout(()=>{
      if(!draftPatch||draftPatch.id!=='d3') return;

      if(i===changes.length-1){
        draftPatch.status='ready';running=false;flashId=null;
        msgs.push({r:'a',t:'重新识别完成：发现 <b>3 处变化</b>。左侧抽屉已用红/绿显示原值和草稿值。税额与不含税金额相加仍等于价税合计 ¥6,046.50；请核对票面后决定应用或撤销。'});
      }

  }else if(kind==='low'){
    msgs.push({r:'u',t:'处理今天的低置信发票'});
    msgs.push({r:'a',tool:['invoice.query','1 条'],
      t:'今天只有 1 张低置信：国网浙江 <b>¥6,046.50</b>（61%，vision 兜底）。不含税 + 税额 = ¥6,046.50 与价税合计一致，但税率算下来是 12.98%，不符合常见档位 —— 建议人工核对票面。已在左侧定位并高亮。',
      jumps:[['打开这张票','d3']]});
    dom='fin';seg.fin='inv';sel.fin='d3';ctx={label:'国网浙江省电力公司',id:'d3'};flashId='d3';
    setTimeout(()=>{flashId=null;render()},3200);
  }else if(kind==='recv'){
    msgs.push({r:'u',t:'华腾回款到了吗'});
    msgs.push({r:'a',tool:['receivable.query','1 条'],
      t:'没到。华腾应收 <b>¥8,600.00</b>，已收 ¥0.00，到期 2026-08-11，<b>已逾期 6 天</b>。',
      jumps:[['打开这笔应收','d4'],['看全部应收','seg:recv']]});
    dom='fin';seg.fin='recv';sel.fin='d4';ctx={label:'华腾电子科技有限公司',id:'d4'};flashId='d4';
    setTimeout(()=>{flashId=null;render()},3200);
  }else{

  const r=DOC(draftPatch.id);
  draftPatch.changes.forEach(c=>r.f[c.field]=c.value);
  draftPatch=null;running=false;
  msgs.push({r:'a',tool:['invoice.patch','3 处'],t:'草稿已应用，并写入操作日志。左侧已恢复为正常字段显示。'});
  render();
}

/* ═══ 其它交互 ═══ */
function goDom(id){modPage=null;dom=id;checked.clear();if(id!=='proj')projView='list';
  if(chatMode==='full')chatMode=lastMode==='full'?'split':lastMode;render()}
function setSeg(k){seg[dom]=k;sel[dom]=null;ctx=null;checked.clear();render()}
function setView(v){projView=v;if(v==='board'&&!sel.proj)sel.proj=PROJECTS[0].id;render()}
function cycleProj(){const i=PROJECTS.findIndex(p=>p.id===sel.proj);sel.proj=PROJECTS[(i+1)%PROJECTS.length].id;render()}
function step(n){const rs=rows(),i=rs.findIndex(x=>x.id===sel[dom]);const j=i+n;
  if(j>=0&&j<rs.length)pick(rs[j].id)}
function tick(id){checked.has(id)?checked.delete(id):checked.add(id);render()}
function clearCk(){checked.clear();render()}
function togglePin(id){pinned=pinned.includes(id)?pinned.filter(x=>x!==id):[...pinned,id];render();if(cmdOpen)renderCmd()}
function openMod(id){modPage=id;sel[dom]=null;ctx=null;closeCmd();if(chatMode==='full')chatMode=lastMode==='full'?'float':lastMode;render()}
function closeMod(){modPage=null;render()}

/* ═══ 命令面板 ═══ */
function cmdList(){const q=cmdQ.trim().toLowerCase();
  return MODULES.filter(m=>!q||m.n.toLowerCase().includes(q)||m.id.includes(q)||m.sec.includes(q))}
function renderCmd(){
  const list=cmdList();if(cmdCur>=list.length)cmdCur=Math.max(0,list.length-1);
  let h='',s='';
  list.forEach((m,i)=>{if(m.sec!==s){h+=`<div class="cmd-sec">${m.sec}</div>`;s=m.sec}
    h+=`<button class="cmd-it ${i===cmdCur?'cur':''}" onclick="openMod('${m.id}')">
      <span class="ico">${I[m.ico]}</span><span class="nm">${m.n}</span>
      <span class="tag">${m.real?'':'mock'}</span>
      <span class="pin ${pinned.includes(m.id)?'on':''}" onclick="event.stopPropagation();togglePin('${m.id}')">${I.star}</span></button>`});
  $('#cmd').innerHTML=`<div class="cmd-hd">${I.search}
      <input id="cmdin" placeholder="搜索模块、跳转页面…" value="${cmdQ}"
        oninput="cmdQ=this.value;cmdCur=0;renderCmd();fc()"></div>
    <div class="cmd-bd">${h||'<div class="empty">没有匹配的模块</div>'}</div>
    <div class="cmd-ft"><span>↑↓ 选择</span><span>Enter 打开</span><span>★ 钉到左侧</span>
      <span style="margin-left:auto">${MODULES.length} 个模块</span></div>`;
}
function fc(){const el=$('#cmdin');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
function openCmd(){cmdOpen=true;cmdQ='';cmdCur=0;renderCmd();
  $('#cmd').classList.add('show');$('#mask').classList.add('show');setTimeout(fc,0)}
function closeCmd(){cmdOpen=false;$('#cmd').classList.remove('show');$('#mask').classList.remove('show')}

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if((e.metaKey||e.ctrlKey)&&k==='k'){e.preventDefault();cmdOpen?closeCmd():openCmd();return}
  if((e.metaKey||e.ctrlKey)&&k==='j'){e.preventDefault();setMode(chatMode==='hidden'?lastMode:'hidden');return}
  if(e.key==='Escape'){if(cmdOpen){closeCmd();return}if(chatMode==='float'){setMode('hidden');return}}
  if(cmdOpen){
    const list=cmdList();
    if(e.key==='ArrowDown'){e.preventDefault();cmdCur=Math.min(cmdCur+1,list.length-1);renderCmd();fc()}
    if(e.key==='ArrowUp'){e.preventDefault();cmdCur=Math.max(cmdCur-1,0);renderCmd();fc()}
    if(e.key==='Enter'&&list[cmdCur])openMod(list[cmdCur].id);
  }
});

function render(){renderRail();renderZone();renderFloat();renderFab();
  document.querySelectorAll('.cw-body').forEach(b=>b.scrollTop=b.scrollHeight)}
render();
</script>
