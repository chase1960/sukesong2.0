<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录背景 Shader 选型 · 尚书</title>
<style>
  :root{
    --green:#10B981; --green2:#0EA372; --canvas:#E8EAEB;
    --ink:#1e232c; --muted:rgba(0,0,0,.45);
    --r:6px; --workspace-radius:10px;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:#dfe1e3;color:var(--ink);padding:28px 24px 48px}
  .page-hd{max-width:1200px;margin:0 auto 24px}
  .page-hd h1{font-size:22px;font-weight:600;margin-bottom:6px}
  .page-hd p{font-size:13px;color:var(--muted);line-height:1.7;max-width:820px}
  .page-hd p code{font-size:11px;background:rgba(0,0,0,.06);padding:1px 5px;border-radius:3px}
  .page-hd a{color:var(--green2);text-decoration:none}
  .page-hd a:hover{text-decoration:underline}
  .grid{
    max-width:1200px;margin:0 auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px;
  }
  .demo{
    background:#fff;border-radius:var(--workspace-radius);
    box-shadow:0 4px 16px rgba(0,0,0,.08);overflow:hidden;
    border:2px solid transparent;transition:border-color .2s,box-shadow .2s;
  }
  .demo.selected{border-color:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.15),0 4px 16px rgba(0,0,0,.1)}
  .demo-preview{position:relative;height:220px;background:var(--canvas);overflow:hidden}
  .demo-preview .shader-host{position:absolute;inset:0}
  .demo-preview .shader-host canvas{display:block;width:100%;height:100%}
  /* 模拟登录卡片浮层 */
  .demo-mock{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:2;
  }
  .demo-card{
    width:200px;padding:18px 16px 14px;
    background:rgba(255,255,255,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(0,0,0,.06);border-radius:var(--workspace-radius);
    box-shadow:0 8px 20px rgba(0,0,0,.1);
  }
  .demo-card b{display:block;font-size:11px;margin-bottom:8px;color:var(--ink)}
  .demo-card .line{height:8px;background:rgba(0,0,0,.08);border-radius:3px;margin-bottom:6px}
  .demo-card .line.w60{width:60%}
  .demo-card .btn-mock{height:22px;background:var(--green);border-radius:var(--r);margin-top:8px}
  .demo-meta{padding:14px 16px 16px}
  .demo-meta h2{font-size:14px;font-weight:600;margin-bottom:4px}
  .demo-meta p{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:10px}
  .demo-meta .tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(16,185,129,.12);color:var(--green2);margin-right:6px}
  .pick{
    width:100%;height:34px;border:1px solid rgba(0,0,0,.12);border-radius:var(--r);
    background:#fff;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;
  }
  .pick:hover{background:var(--green);color:#fff;border-color:var(--green)}
  .demo.selected .pick{background:var(--green);color:#fff;border-color:var(--green)}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r);
    font-size:13px;opacity:0;transition:transform .25s,opacity .25s;z-index:99;pointer-events:none;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .err-banner{
    max-width:1200px;margin:0 auto 16px;padding:12px 16px;border-radius:var(--r);
    background:#FBEAEA;color:#DC4444;font-size:13px;display:none;
  }
</style>
</head>
<body>
<div class="page-hd">
  <h1>登录页背景 · Shader 选型</h1>
  <p>
    共 <span id="demo-count">—</span> 种效果，每种下方有模拟登录卡片。点击「选用此效果」会高亮并复制效果 ID，告诉我编号即可。
    本页由 <code>shader-demo.html</code> + <code>js/shader-demo.js</code> 两个文件组成（shader 库走 CDN，无需 npm）。
    <a href="login.html">← 返回登录页</a>
  </p>
</div>
<div class="err-banner" id="err"></div>
<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>

<script type="module" src="js/shader-demo.js"></script>
</body>
</html>
