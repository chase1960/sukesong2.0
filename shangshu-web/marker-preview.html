<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 标识候选 · 尚书</title>
<style>
  body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#fff;color:#1e232c;margin:0;padding:48px 24px}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:18px;margin:0 0 4px}
  .sub{font-size:12.5px;color:rgba(0,0,0,.45);margin-bottom:32px}
  .cand{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid rgba(0,0,0,.06)}
  .cand:last-child{border-bottom:none}
  .id{font-size:12px;color:rgba(0,0,0,.45);width:120px;flex-shrink:0;padding-top:14px}
  .id b{display:block;color:#1e232c;font-size:13px;margin-bottom:3px}
  .demo{flex:1}
  .row{display:flex;gap:10px;margin-bottom:14px}
  .txt{font-size:15px;line-height:1.85}
  .mk{flex-shrink:0;margin-top:8px;display:grid;place-items:center;width:16px;height:16px}
  .tagline{font-size:11.5px;color:rgba(0,0,0,.45)}
  /* A 单圆点 */
  .mk-a i{width:6px;height:6px;border-radius:50%;background:#10B981}
  .mk-a.think i{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  /* B 圆角方块 */
  .mk-b i{width:7px;height:7px;border-radius:2.5px;background:#10B981}
  .mk-b.think i{animation:pulse 1s infinite}
  /* C 声波三条（已入选，与线上同步：3px 条 6/12/6，大幅波动） */
  .mk-c{display:flex;align-items:center;gap:3px}
  .mk-c i{width:3px;border-radius:2px;background:#10B981}
  .mk-c i:nth-child(1){height:6px}.mk-c i:nth-child(2){height:12px}.mk-c i:nth-child(3){height:6px}
  .mk-c.think i{animation:wave .8s ease-in-out infinite}
  .mk-c.think i:nth-child(2){animation-delay:.12s}.mk-c.think i:nth-child(3){animation-delay:.24s}
  @keyframes wave{0%,100%{transform:scaleY(.45);opacity:.55}50%{transform:scaleY(1.25);opacity:1}}
  /* D 竖线光标 */
  .mk-d i{width:2.5px;height:14px;border-radius:2px;background:#10B981}
  .mk-d.think i{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.15}}
  /* E 迷你印章 */
  .mk-e img{height:15px;width:auto;display:block}
  .mk-e.think img{animation:pulse 1s infinite}
  /* F 三点横排（typing） */
  .mk-f{display:flex;gap:2.5px}
  .mk-f i{width:3.5px;height:3.5px;border-radius:50%;background:#10B981}
  .mk-f.think i{animation:typing 1.2s infinite}
  .mk-f.think i:nth-child(2){animation-delay:.2s}.mk-f.think i:nth-child(3){animation-delay:.4s}
  @keyframes typing{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
  /* G 圆环 */
  .mk-g i{width:7px;height:7px;border-radius:50%;border:1.8px solid #10B981;box-sizing:border-box}
  .mk-g.think i{animation:pulse 1s infinite}
  /* H 四点星（与侧栏「对话」图标同形） */
  .mk-h i{width:12px;height:12px;color:#2E5E4E}
  .mk-h.think i{animation:spinpulse 1.4s ease-in-out infinite}
  @keyframes spinpulse{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
  /* I 当前方案：2×3 点阵 */
  .mk-i{display:grid;grid-template-columns:repeat(2,3.5px);grid-template-rows:repeat(3,3.5px);gap:2px;width:9px;height:14.5px}
  .mk-i i{width:3.5px;height:3.5px;border-radius:50%;background:#10B981}
  .mk-i.think i{animation:avadot 1.2s ease-in-out infinite}
  .mk-i.think i:nth-child(1){animation-delay:0s}.mk-i.think i:nth-child(3){animation-delay:.2s}
  .mk-i.think i:nth-child(5){animation-delay:.4s}.mk-i.think i:nth-child(6){animation-delay:.6s}
  .mk-i.think i:nth-child(4){animation-delay:.8s}.mk-i.think i:nth-child(2){animation-delay:1s}
  @keyframes avadot{0%{opacity:0}10%{opacity:1}30%{opacity:0}100%{opacity:0}}
  /* J 无标识 */
  .mk-j{display:none}
  .mk-j-txt::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#10B981;margin-right:8px;vertical-align:1px}
  .mk-j-txt.think::before{animation:pulse 1s infinite}
</style>
</head>
<body>
<div class="wrap">
  <h1>AI 消息标识候选</h1>
  <div class="sub">每组上面是平时态，下面是「生成中」动画态。挑一个编号告诉我。</div>
  <div id="list"></div>
</div>
<script>
const SPARK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/></svg>';
const CANDS = [
  ['A', '单圆点', '最简。一个翠绿色点，像状态灯', '<i></i>'],
  ['B', '圆角方块', '比圆点更"实体"，现代感', '<i></i>'],
  ['C', '声波三条', '像在"说话"，生成中波动最自然', '<i></i><i></i><i></i>'],
  ['D', '竖线光标', '编辑器隐喻：AI 正在这里写字', '<i></i>'],
  ['E', '迷你印章', 'AI 就是尚书——用品牌印章当分身', '<img src="logo.svg">'],
  ['F', '三点横排', '经典 typing 指示，用户最眼熟', '<i></i><i></i><i></i>'],
  ['G', '空心圆环', '比实心点更轻', '<i></i>'],
  ['H', '四点星', '与侧栏「对话」图标同形，AI 行业惯例', SPARK],
  ['I', '2×3 点阵（现状）', '当前方案，留着对比', '<i></i><i></i><i></i><i></i><i></i><i></i>'],
  ['J', '无标识', '最克制，文字前一个小圆点只在行内', ''],
];
document.getElementById('list').innerHTML = CANDS.map(([id, name, desc, mk]) => `
  <div class="cand">
    <div class="id"><b>${id} · ${name}</b>${desc}</div>
    <div class="demo">
      ${id === 'J' ? `
        <div class="row"><div class="txt mk-j-txt">已查到：本月共收发票 27 张，其中待审 2 张。</div></div>
        <div class="row"><div class="txt mk-j-txt think">正在查库存数据…</div></div>`
      : `
        <div class="row"><span class="mk mk-${id.toLowerCase()}">${mk}</span><div class="txt">已查到：本月共收发票 27 张，其中待审 2 张。</div></div>
        <div class="row"><span class="mk mk-${id.toLowerCase()} think">${mk}</span><div class="txt" style="color:rgba(0,0,0,.45)">正在查库存数据…</div></div>`}
      <div class="tagline"></div>
    </div>
  </div>`).join('');
</script>
</body>
</html>
