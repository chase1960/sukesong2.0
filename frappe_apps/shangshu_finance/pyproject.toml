[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shangshu-finance"
version = "0.3.1"
description = "尚书财务插件：票据、报销、过账、应付与付款"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shangshu" }]
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["shangshu_finance*"]
