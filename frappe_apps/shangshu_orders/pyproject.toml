[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "shangshu-orders"
version = "0.1.0"
description = "尚书订单履约最小领域"
requires-python = ">=3.10"
[tool.setuptools.packages.find]
where = ["."]
include = ["shangshu_orders*"]
[tool.setuptools]
include-package-data = true

